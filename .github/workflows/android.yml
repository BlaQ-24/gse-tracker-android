name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      signed: ${{ steps.sign.outputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Prepare web assets (tracker + Capacitor runtime)
        run: node scripts/prepare-www.mjs
      - id: ver
        run: echo "version=$(grep -oP "const APP_VERSION\s*=\s*'\K[^']+" src/tracker.html)" >> "$GITHUB_OUTPUT"
      - run: npx cap sync android
      - name: Restore signing key
        id: sign
        env: { PASS: '${{ secrets.GSE_SIGNING_PASS }}' }
        run: |
          if [ -n "$PASS" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in signing/gse-tracker-release.jks.enc -out "$RUNNER_TEMP/gse-release.jks" -pass env:PASS
            echo "GSE_KEYSTORE=$RUNNER_TEMP/gse-release.jks" >> "$GITHUB_ENV"; echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Secret GSE_SIGNING_PASS is not set: the release APK is unsigned and will not be published"; echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Build APKs
        working-directory: android
        env:
          GSE_KEYSTORE_PASSWORD: ${{ secrets.GSE_SIGNING_PASS }}
          GSE_KEY_ALIAS: gsetracker
          GSE_KEY_PASSWORD: ${{ secrets.GSE_SIGNING_PASS }}
        run: |
          V="${{ steps.ver.outputs.version }}"; IFS=. read -r MA MI PA <<< "$V"
          ./gradlew assembleRelease assembleDebug --no-daemon -PversionName="$V" -PversionCode=$((MA*10000+MI*100+PA))
      - name: Collect
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release*.apk "dist/GSE-Tracker-${{ steps.ver.outputs.version }}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/app-debug.apk
          ls -la dist
      - uses: actions/upload-artifact@v4
        with: { name: apk, path: dist/ }

  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run on an Android 14 emulator
        id: smoke
        run: bash ci/emulator.sh
      - name: Summarise the smoke test
        if: always()
        run: |
          if [ -f smoke-out/results.json ]; then node -e 'const r=require("./smoke-out/results.json");const s=JSON.stringify(r);console.log("::notice title=smoke::"+s.slice(0,3500).replace(/%/g,"%25").replace(/\r/g,"").replace(/\n/g," "))'; fi
          tail -c 3000 smoke-out/emulator.log | tr '\n' ' ' | sed 's/^/::warning title=emulator-log-tail::/' ; echo
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: smoke-test, path: smoke-out/ }
      - name: Publish test output to the ci-results branch
        if: always()
        run: |
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          D=$(mktemp -d); cp -r smoke-out/. "$D"/ 2>/dev/null || true
          git checkout --orphan ci-results-tmp; git rm -rqf . ; rm -rf ./* ./.github ./.gitignore 2>/dev/null || true
          mkdir -p "run-${{ github.run_number }}"; cp -r "$D"/. "run-${{ github.run_number }}"/ ; git add -A
          git commit -qm "smoke test output, run ${{ github.run_number }}" && git push -f origin HEAD:ci-results

  release:
    needs: [build, smoke-test]
    if: needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: apk, path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}-b${{ github.run_number }}
          name: GSE Tracker ${{ needs.build.outputs.version }} (build ${{ github.run_number }})
          body: Install GSE-Tracker-${{ needs.build.outputs.version }}.apk on your phone. Same signing key as every earlier build, so it installs over the previous version and keeps your data.
          files: dist/GSE-Tracker-${{ needs.build.outputs.version }}.apk
          make_latest: true
